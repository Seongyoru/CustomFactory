# =============================================================================
#  GitHub Pages 정적 배포 — push 하면 검사 → 빌드 → 배포
# =============================================================================
#  - 검사(npm test)가 깨지면 build 잡이 실패하므로 deploy 잡은 실행되지 않는다.
#  - 빌드는 base './' 상대 경로라 저장소 이름과 무관하게 동작한다.
#  - 최초 1회: 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꿔야 한다.
#    (configure-pages 의 enablement 가 자동 활성화를 시도하지만, 권한에 따라
#     수동 설정이 필요할 수 있다)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만 — 진행 중인 프로덕션 배포는 끊지 않는다
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 기준 경로 결합 규칙('/', './', '/저장소이름/')을 못 박는 검사.
      # 여기서 깨지면 빌드·배포로 넘어가지 않는다.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
