 *  [ 컴포넌트 분리 가이드 ]

 *
 *  src/
 *   ├─ layouts/
 *   │   └─ DigitalTwinLayout.jsx        // 최상위 grid 뼈대 + 전역 state(mode, selected)
 *   ├─ context/
 *   │   └─ TwinContext.jsx              // mode / estop / selectedAsset 전역 공유 (Context or Zustand)

 *   │   └─ theme.js                     // THEME 상수 (운전/시뮬레이션 색상 토큰)
 *   ├─ components/
 *   │   ├─ gnb/
 *   │   │   ├─ TopGnb.jsx               // GNB 컨테이너
 *   │   │   ├─ PlantSelector.jsx        // 공장/라인 드롭다운
 *   │   │   ├─ ModeToggle.jsx           // 운전/시뮬레이션 토글
 *   │   │   └─ EmergencyStopButton.jsx  // E-STOP + 확인 모달
 *   │   ├─ left/
 *   │   │   ├─ LeftDashboardPanel.jsx   // 좌측 패널 컨테이너
 *   │   │   ├─ LineProgress.jsx         // 라인 진행률 프로그레스바
 *   │   │   ├─ JobQueueList.jsx         // 작업 대기열 + 액션 버튼
 *   │   │   └─ SimSpeedSlider.jsx       // 시뮬레이션 배속 슬라이더
 *   │   ├─ viewport/
 *   │   │   ├─ TwinViewport.jsx         // Three.js / Cesium 마운트 지점 (canvas ref)
 *   │   │   ├─ ViewportToolbar.jsx      // 카메라/레이어 컨트롤
 *   │   │   └─ CctvPipPanel.jsx         // CCTV PIP 오버레이
 *   │   └─ right/
 *   │       ├─ AssetDetailSidebar.jsx   // 우측 사이드바 컨테이너(슬라이드 애니메이션)
 *   │       ├─ AssetInfoSection.jsx     // 기본 정보 / 점검 이력
 *   │       ├─ AssetStatusLamp.jsx      // 상태등
 *   │       ├─ AssetSimControl.jsx      // 시뮬레이션 제어 폼
 *   │       └─ AssetMemoField.jsx       // 작업자 메모
 *   └─ hooks/
 *       ├─ useTwinRenderer.js           // GLB 로딩 / GIS 좌표 정합 / 렌더 루프
 *       └─ useAssetSelection.js         // 3D raycast pick → selectedAsset 동기화
 *
 *  [ 3D 연동 지점 ]
 *  TwinViewport 내부 <canvas ref={canvasRef}> 하나만 넘겨주면
 *  useTwinRenderer(canvasRef) 에서 Three.js WebGLRenderer / Cesium Viewer 를
 *  생성하도록 설계했습니다. React는 리렌더에 관여하지 않습니다(ref 고정).
 * =============================================================================
 */

 * 3. 공용 프리미티브
 * ------------------------------------------------------------------------- */
const Panel = ({ theme, className = '', children }) => (
  <section
    className={`rounded-xl border ${theme.panelBorder} ${theme.panelBg} backdrop-blur-sm ${className}`}
  >
    {children}
  </section>
);

const PanelTitle = ({ icon: Icon, title, right, theme }) => (
  <header className="flex items-center justify-between px-3 py-2.5 border-b border-white/5">
    <div className="flex items-center gap-2">

      <h2 className="text-[13px] font-semibold tracking-tight text-slate-100">{title}</h2>
    </div>
    {right}

);

const StatusLamp = ({ state, size = 'sm', showLabel = true }) => {
  const s = STATUS[state] ?? STATUS.IDLE;
  const dot = size === 'lg' ? 'w-3.5 h-3.5' : 'w-2 h-2';
  return (
    <span className="inline-flex items-center gap-1.5">
      <span className={`relative flex ${dot}`}>
        {s.pulse && (
          <span className={`absolute inline-flex w-full h-full rounded-full opacity-60 animate-ping ${s.dot}`} />
        )}
        <span className={`relative inline-flex w-full h-full rounded-full ring-2 ${s.ring} ${s.dot}`} />
      </span>
      {showLabel && <span className={`text-xs font-medium ${s.text}`}>{s.label}</span>}
    </span>
  );
};

const GhostButton = ({ icon: Icon, children, onClick, theme, danger = false, className = '' }) => (

        <footer className="grid grid-cols-3 gap-1.5 p-2 border-t border-white/5">
          <GhostButton icon={Plus} theme={theme}>작업 추가</GhostButton>
          <GhostButton icon={Upload} theme={theme}>엑셀 업로드</GhostButton>
          <GhostButton icon={X} theme={theme} danger>취소</GhostButton>
        </footer>
      </Panel>

      {/* 5-3. 시뮬레이션 배속 -------------------------------------------- */}
      <Panel theme={theme}>
        <PanelTitle icon={Settings2} title="시뮬레이션 배속" theme={theme}
          right={<span className={`text-xs font-bold tabular-nums ${theme.accentText}`}>{speed.toFixed(1)}x</span>} />
        <div className="p-3 pt-2.5">
          <input
            type="range"
            min={1}
            max={4}
            step={0.5}
            value={speed}
            disabled={mode !== 'simulation'}
            onChange={(e) => onSpeedChange(Number(e.target.value))}
            className={`w-full h-1.5 rounded-full appearance-none cursor-pointer bg-black/50 accent-fuchsia-500
              disabled:opacity-40 disabled:cursor-not-allowed
              ${mode === 'simulation' ? 'accent-fuchsia-500' : 'accent-sky-500'}`}
          />
          <div className="flex justify-between mt-1.5 text-[10px] tabular-nums text-slate-500">
            {[1, 2, 3, 4].map((v) => <span key={v}>{v}x</span>)}
          </div>
          {mode !== 'simulation' && (
            <p className="mt-2 text-[10px] leading-relaxed text-slate-500">
              실시간 운전 중에는 배속 조절이 잠깁니다. 시뮬레이션 모드로 전환하세요.
            </p>
          )}
        </div>
      </Panel>
    </aside>
  );
};

/* ---------------------------------------------------------------------------
 * 6. 중앙 - 3D 뷰포트 (+ CCTV PIP)
 *    canvasRef 를 useTwinRenderer(canvasRef) 로 넘겨 GLB / GIS 를 렌더링합니다.
 * ------------------------------------------------------------------------- */
const TwinViewport = ({ theme, mode, onSelectAsset, selectedId }) => {
  const canvasRef = useRef(null);
  const [cctvOpen, setCctvOpen] = useState(true);

  return (
    <main className="relative flex-1 min-w-0 h-full p-3 pl-0">
      <div
        className={`relative w-full h-full rounded-xl overflow-hidden border ${theme.panelBorder} ${theme.viewportGrid} ${theme.glow}`}
      >
        {/* ===== 3D RENDER TARGET ===== */}
        {/* Three.js: new WebGLRenderer({ canvas: canvasRef.current })                */}
        {/* Cesium  : new Cesium.Viewer(containerRef.current) → canvas 대신 div 사용   */}
        <canvas ref={canvasRef} className="absolute inset-0 w-full h-full block" />

        {/* 렌더러 연결 전 placeholder 그리드 (연동 후 제거) */}
        <div
          className="absolute inset-0 pointer-events-none opacity-[0.18]"
          style={{
            backgroundImage:
              'linear-gradient(to right, rgba(148,163,184,.5) 1px, transparent 1px),' +
              'linear-gradient(to bottom, rgba(148,163,184,.5) 1px, transparent 1px)',
            backgroundSize: '48px 48px',
            maskImage: 'radial-gradient(ellipse at center, black 30%, transparent 78%)',
            WebkitMaskImage: 'radial-gradient(ellipse at center, black 30%, transparent 78%)',
          }}
        />

        <div className="absolute inset-0 grid place-items-center pointer-events-none">
          <div className="text-center select-none">
            <Move3d className={`w-10 h-10 mx-auto mb-2 ${theme.accentText} opacity-50`} />
            <p className="text-sm font-semibold text-slate-400">3D VIEWPORT</p>
            <p className="text-[11px] text-slate-600 mt-1">GLB Asset / GIS Layer mount point</p>
          </div>
        </div>

        {/* --- 좌상단 상태 HUD --- */}
        <div className="absolute top-3 left-3 flex items-center gap-2">
          <span className={`px-2.5 py-1 rounded-md text-[10px] font-bold border ${theme.chip}`}>
            {mode === 'simulation' ? 'SIMULATION' : 'LIVE'}
          </span>
          <span className="px-2.5 py-1 rounded-md text-[10px] tabular-nums text-slate-400 bg-black/50 border border-white/10">
            60 FPS · 128k tri
          </span>
        </div>

        {/* --- 우상단 뷰 컨트롤 --- */}
        <div className="absolute top-3 right-3 flex flex-col gap-1.5">
          {[Move3d, Layers, Camera, RotateCcw, Maximize2].map((Icon, i) => (
            <button
              key={i}
              type="button"
              className="grid place-items-center w-8 h-8 rounded-md bg-black/50 border border-white/10
                text-slate-300 hover:text-white hover:bg-white/10 backdrop-blur-sm transition"
            >
              <Icon className="w-4 h-4" />
            </button>
          ))}
        </div>

        {/* --- 더미 설비 핫스팟 (실제로는 raycaster pick 이벤트로 대체) --- */}
        {ASSET_HOTSPOTS.map((asset) => {
          const s = STATUS[asset.status];
          const active = selectedId === asset.id;
          return (
            <button
              key={asset.id}
              type="button"
              onClick={() => onSelectAsset(asset)}
              style={{ top: asset.pos.top, left: asset.pos.left }}
              className="absolute -translate-x-1/2 -translate-y-1/2 group"
            >
              <span className="relative flex w-4 h-4">
                <span className={`absolute inline-flex w-full h-full rounded-full opacity-50 animate-ping ${s.dot}`} />
                <span
                  className={`relative inline-flex w-full h-full rounded-full ring-4 ${s.dot}
                    ${active ? 'ring-white/60 scale-125' : 'ring-black/40'} transition-transform`}
                />
              </span>
              <span
                className={`absolute left-6 top-1/2 -translate-y-1/2 whitespace-nowrap rounded-md border px-2 py-1
                  text-[10px] font-medium backdrop-blur-sm transition-opacity
                  ${active ? 'opacity-100' : 'opacity-0 group-hover:opacity-100'}
                  ${theme.panelBorder} bg-black/70 text-slate-200`}
              >
                {asset.name} · {s.label}
              </span>
            </button>
          );
        })}

        {/* --- 하단 CCTV PIP 오버레이 --- */}
        <div className="absolute bottom-3 left-3 right-3 flex justify-start pointer-events-none">
          <div
            className={`pointer-events-auto rounded-lg border ${theme.panelBorder} bg-black/70 backdrop-blur-md
              ${theme.glow} transition-all duration-300`}
          >
            <header className="flex items-center justify-between px-2.5 py-1.5 border-b border-white/5">
              <div className="flex items-center gap-1.5">
                <Video className={`w-3.5 h-3.5 ${theme.accentText}`} />
                <span className="text-[11px] font-semibold text-slate-200">CCTV 모니터링</span>
                <span className="ml-1 flex items-center gap-1 text-[9px] text-red-400">
                  <span className="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse" /> REC
                </span>
              </div>
              <button
                type="button"
                onClick={() => setCctvOpen((v) => !v)}
                className="text-slate-400 hover:text-white text-[10px] px-1"
              >
                {cctvOpen ? '접기' : '펼치기'}
              </button>
            </header>

            {cctvOpen && (
              <div className="flex gap-2 p-2">
                {[
                  { id: 'CAM-01', label: 'A라인 · 조립 셀 상부' },
                  { id: 'CAM-04', label: 'A라인 · 프레스 정면' },
                ].map((cam) => (
                  <figure
                    key={cam.id}
                    className="relative w-[184px] aspect-video rounded-md overflow-hidden border border-white/10 bg-slate-950 group"
                  >
                    {/* <video> 또는 WebRTC / HLS player 삽입 지점 */}
                    <div className="absolute inset-0 grid place-items-center bg-[repeating-linear-gradient(45deg,#0f172a_0px,#0f172a_8px,#111827_8px,#111827_16px)]">
                      <Camera className="w-5 h-5 text-slate-600" />
                    </div>
                    <figcaption className="absolute inset-x-0 bottom-0 flex items-center justify-between px-1.5 py-1 bg-gradient-to-t from-black/90 to-transparent">
                      <span className="text-[9px] font-medium text-slate-200">{cam.label}</span>
                      <span className="text-[9px] tabular-nums text-slate-400">{cam.id}</span>
                    </figcaption>
                    <button
                      type="button"
                      className="absolute top-1 right-1 grid place-items-center w-5 h-5 rounded bg-black/60
                        text-slate-300 opacity-0 group-hover:opacity-100 transition"
                    >
                      <Maximize2 className="w-3 h-3" />
                    </button>
                  </figure>
                ))}
              </div>
            )}
          </div>
        </div>
      </div>
    </main>
  );
};

/* ---------------------------------------------------------------------------
 * 7. 우측 사이드바 - 단일 설비 상세 속성창
 *    open 여부에 따라 translate-x 로 slide in/out
 * ------------------------------------------------------------------------- */
const AssetDetailSidebar = ({ theme, mode, asset, onClose }) => {
  const [simCount, setSimCount] = useState(100);
  const [simRunning, setSimRunning] = useState(false);
  const [memo, setMemo] = useState('');

  // 더미 예측 완료 시간: 사이클타임 × 횟수
  const eta = useMemo(() => {
    if (!asset) return '--:--';
    const totalSec = asset.cycleSec * simCount;
    const done = new Date(Date.now() + totalSec * 1000);
    return `${String(done.getHours()).padStart(2, '0')}:${String(done.getMinutes()).padStart(2, '0')}`;
  }, [asset, simCount]);

  const open = Boolean(asset);

  return (
    <aside
      className={`absolute top-0 right-0 h-full w-[360px] z-20 transition-transform duration-300 ease-out
        ${open ? 'translate-x-0' : 'translate-x-full'}`}
      aria-hidden={!open}
    >
      <div className={`h-full flex flex-col border-l ${theme.panelBorder} ${theme.headerBg} shadow-2xl shadow-black/60`}>
        {/* --- 헤더 --- */}
        <header className={`shrink-0 px-4 py-3 border-b ${theme.panelBorder} ${theme.accentBgSoft}`}>
          <div className="flex items-start justify-between gap-2">
            <div className="min-w-0">
              <p className={`text-[10px] font-semibold tracking-widest ${theme.accentText}`}>EQUIPMENT DETAIL</p>
              <h2 className="mt-1 text-[15px] font-bold text-white truncate">{asset?.name ?? '-'}</h2>
              <p className="text-[11px] text-slate-400 tabular-nums mt-0.5">{asset?.id}</p>
            </div>
            <button
              type="button"
              onClick={onClose}
              className="shrink-0 grid place-items-center w-7 h-7 rounded-md text-slate-400 hover:text-white hover:bg-white/10"
              aria-label="닫기"
            >
              <X className="w-4 h-4" />
            </button>
          </div>

          {/* 상태등 */}
          <div className="mt-3 flex items-center justify-between rounded-lg border border-white/10 bg-black/30 px-3 py-2">
            <span className="text-[11px] text-slate-400">현재 상태</span>
            <StatusLamp state={asset?.status ?? 'IDLE'} size="lg" />
          </div>
        </header>

        <div className="flex-1 overflow-y-auto p-3 space-y-3">
          {/* --- 기본 정보 --- */}
          <Panel theme={theme}>
            <PanelTitle icon={Cpu} title="기본 정보" theme={theme} />
            <dl className="p-3 grid grid-cols-3 gap-y-2.5 text-[11px]">
              {[
                ['설비명', asset?.name],
                ['S/N', asset?.sn],
                ['제조사', asset?.maker],
                ['모델', asset?.model],
                ['설치일', asset?.installedAt],
                ['Cycle Time', asset ? `${asset.cycleSec.toFixed(1)} sec` : '-'],
              ].map(([k, v]) => (
                <React.Fragment key={k}>
                  <dt className="col-span-1 text-slate-500">{k}</dt>
                  <dd className="col-span-2 text-slate-200 tabular-nums truncate">{v ?? '-'}</dd>
                </React.Fragment>
              ))}
            </dl>
          </Panel>

          {/* --- 점검 이력 --- */}
          <Panel theme={theme}>
            <PanelTitle icon={Wrench} title="점검 이력" theme={theme}
              right={<span className="text-[10px] text-slate-500">차기 {asset?.nextCheck ?? '-'}</span>} />
            <ol className="p-3 space-y-2.5">
              {(asset?.history ?? []).map((h, i) => (
                <li key={i} className="relative pl-4">
                  <span className={`absolute left-0 top-1.5 w-1.5 h-1.5 rounded-full ${i === 0 ? theme.accentBg : 'bg-slate-600'}`} />
                  {i < (asset?.history.length ?? 0) - 1 && (
                    <span className="absolute left-[2.5px] top-3.5 bottom-[-10px] w-px bg-white/10" />
                  )}
                  <div className="flex items-center gap-2">
                    <span className="text-[11px] tabular-nums text-slate-300">{h.date}</span>
                    <span className={`px-1.5 py-0.5 rounded text-[9px] border ${theme.chip}`}>{h.type}</span>
                  </div>
                  <p className="text-[11px] text-slate-500 mt-0.5">{h.note}</p>
                </li>
              ))}
            </ol>
          </Panel>

          {/* --- 시뮬레이션 제어 --- */}
          <Panel theme={theme} className={mode === 'simulation' ? theme.glow : ''}>
            <PanelTitle icon={Activity} title="시뮬레이션 제어" theme={theme}
              right={<span className={`text-[10px] px-2 py-0.5 rounded border ${theme.chip}`}>
                {mode === 'simulation' ? 'READY' : 'LIVE 잠금'}
              </span>} />
            <div className="p-3 space-y-3">
              <label className="block">
                <span className="block text-[11px] text-slate-400 mb-1">시뮬레이션 횟수 (cycle)</span>
                <input
                  type="number"
                  min={1}
                  max={9999}
                  value={simCount}
                  onChange={(e) => setSimCount(Math.max(1, Number(e.target.value) || 1))}
                  disabled={mode !== 'simulation'}
                  className={`w-full h-9 px-3 rounded-lg border ${theme.panelBorder} bg-black/40 text-sm tabular-nums
                    text-slate-100 focus:outline-none focus:ring-2 ${theme.accentRing}
                    disabled:opacity-40 disabled:cursor-not-allowed`}
                />
              </label>

              <div className="flex items-center justify-between rounded-lg border border-white/10 bg-black/30 px-3 py-2">
                <span className="flex items-center gap-1.5 text-[11px] text-slate-400">
                  <Clock className="w-3.5 h-3.5" /> 예측 완료 시간
                </span>
                <span className={`text-sm font-bold tabular-nums ${theme.accentText}`}>{eta}</span>
              </div>

              <div className="grid grid-cols-2 gap-2">
                <button
                  type="button"
                  onClick={() => setSimRunning(true)}
                  disabled={mode !== 'simulation' || simRunning}
                  className={`inline-flex items-center justify-center gap-1.5 h-9 rounded-lg text-[12px] font-semibold
                    text-white transition ${theme.accentBg} hover:opacity-90
                    disabled:opacity-30 disabled:cursor-not-allowed`}
                >
                  <Play className="w-4 h-4" /> 시작
                </button>
                <button
                  type="button"
                  onClick={() => setSimRunning(false)}
                  disabled={!simRunning}
                  className="inline-flex items-center justify-center gap-1.5 h-9 rounded-lg text-[12px] font-semibold
                    text-slate-200 border border-white/15 hover:bg-white/5 transition
                    disabled:opacity-30 disabled:cursor-not-allowed"
                >
                  <Pause className="w-4 h-4" /> 중지
                </button>
              </div>
            </div>
          </Panel>

          {/* --- 현장 작업자 메모 --- */}
          <Panel theme={theme}>
            <PanelTitle icon={StickyNote} title="작업자 메모" theme={theme} />
            <div className="p-3 space-y-2">
              <textarea
                rows={4}
                value={memo}
                onChange={(e) => setMemo(e.target.value)}
                placeholder="현장 특이사항, 인수인계 내용을 입력하세요."
                className={`w-full rounded-lg border ${theme.panelBorder} bg-black/40 p-2.5 text-[12px] leading-relaxed
                  text-slate-100 placeholder:text-slate-600 resize-none focus:outline-none focus:ring-2 ${theme.accentRing}`}
              />
              <div className="flex items-center justify-between">
                <span className="text-[10px] text-slate-600 tabular-nums">{memo.length} / 500</span>
                <GhostButton icon={Save} theme={theme}>메모 저장</GhostButton>
              </div>
            </div>
          </Panel>
        </div>
      </div>
    </aside>
  );
};

/* ---------------------------------------------------------------------------
 * 8. E-STOP 확인 모달
 * ------------------------------------------------------------------------- */
const EStopModal = ({ engaged, onConfirm, onCancel }) => (
  <div className="fixed inset-0 z-50 grid place-items-center bg-black/70 backdrop-blur-sm">
    <div className="w-[380px] rounded-2xl border border-red-500/40 bg-slate-900 p-6 shadow-2xl">
      <div className="flex items-center gap-3">
        <span className="grid place-items-center w-11 h-11 rounded-xl bg-red-500/15 text-red-400">
          <AlertOctagon className="w-6 h-6" />
        </span>
        <div>
          <h3 className="text-base font-bold text-white">
            {engaged ? '비상 정지 해제' : '비상 정지 실행'}
          </h3>
          <p className="text-[11px] text-slate-400 mt-0.5">화성 1공장 · A라인 (조립)</p>
        </div>
      </div>
      <p className="mt-4 text-[12px] leading-relaxed text-slate-300">
        {engaged
          ? '라인 전 설비의 인터록을 해제하고 운전 대기 상태로 복귀합니다. 현장 안전이 확보되었는지 확인하세요.'
          : '해당 라인의 모든 설비가 즉시 정지되며, 진행 중인 작업 지시는 보류됩니다. 계속하시겠습니까?'}
      </p>
      <div className="mt-5 grid grid-cols-2 gap-2">
        <button
          type="button"
          onClick={onCancel}
          className="h-10 rounded-lg border border-white/15 text-[12px] font-semibold text-slate-200 hover:bg-white/5"
        >
          취소
        </button>
        <button
          type="button"
          onClick={onConfirm}
          className="h-10 rounded-lg bg-red-600 hover:bg-red-500 text-[12px] font-bold text-white"
        >
          {engaged ? '해제 확인' : '즉시 정지'}
        </button>
      </div>
    </div>
  </div>
);

/* ---------------------------------------------------------------------------
 * 9. Root Layout
 * ------------------------------------------------------------------------- */
function DigitalTwinDashboard() {
  const [mode, setMode] = useState('operation');       // 'operation' | 'simulation'
  const [plant, setPlant] = useState(PLANTS[0].id);
  const [jobs, setJobs] = useState(INITIAL_JOBS);
  const [speed, setSpeed] = useState(1);
  const [selectedAsset, setSelectedAsset] = useState(null); // 3D pick 결과 더미
  const [eStopEngaged, setEStopEngaged] = useState(false);
  const [eStopModal, setEStopModal] = useState(false);

  const theme = THEME[mode];

  const handleModeChange = (next) => {
    setMode(next);
    if (next === 'operation') setSpeed(1); // 실시간 운전은 항상 1x
  };

  return (
    <div
      className={`w-screen h-screen overflow-hidden flex flex-col font-sans text-slate-200
        bg-slate-950 selection:bg-fuchsia-500/30 transition-colors duration-500`}
    >
      {/* 시뮬레이션 모드 / E-STOP 상태를 알리는 전역 프레임 */}
      <div
        className={`pointer-events-none fixed inset-0 z-40 ring-2 ring-inset transition-all duration-500
          ${eStopEngaged ? 'ring-red-500/70' : mode === 'simulation' ? 'ring-fuchsia-500/40' : 'ring-transparent'}`}
      />

      <TopGnb
        theme={theme}
        mode={mode}
        onModeChange={handleModeChange}
        plant={plant}
        onPlantChange={setPlant}
        eStopEngaged={eStopEngaged}
        onEStop={() => setEStopModal(true)}
      />

      {/* 본문: 좌측 패널 | 3D 뷰포트 | (오버레이) 우측 상세 사이드바 */}
      <div className="relative flex-1 min-h-0 flex">
        <LeftDashboardPanel
          theme={theme}
          mode={mode}
          jobs={jobs}
          onRemoveJob={(id) => setJobs((prev) => prev.filter((j) => j.id !== id))}
          speed={speed}
          onSpeedChange={setSpeed}
        />

        <TwinViewport
          theme={theme}
          mode={mode}
          selectedId={selectedAsset?.id}
          onSelectAsset={(asset) =>
            setSelectedAsset((prev) => (prev?.id === asset.id ? null : asset))
          }
        />

        <AssetDetailSidebar
          theme={theme}
          mode={mode}
          asset={selectedAsset}
          onClose={() => setSelectedAsset(null)}
        />
      </div>

      {/* 하단 스테이터스 바 */}
      <footer
        className={`h-7 shrink-0 flex items-center justify-between px-4 border-t ${theme.panelBorder}
          ${theme.headerBg} text-[10px] tabular-nums text-slate-500`}
      >
        <div className="flex items-center gap-4">
          <span className="flex items-center gap-1.5">
            <span className="w-1.5 h-1.5 rounded-full bg-emerald-400" /> OPC-UA 연결됨
          </span>
          <span>Latency 24ms</span>
          <span>Sync 2026-07-30 13:42:07</span>
        </div>
        <div className="flex items-center gap-4">
          <span>{mode === 'simulation' ? `SIM ${speed.toFixed(1)}x` : 'REALTIME 1.0x'}</span>
          <span>{PLANTS.find((p) => p.id === plant)?.name}</span>
        </div>
      </footer>

      {eStopModal && (
        <EStopModal
          engaged={eStopEngaged}
          onCancel={() => setEStopModal(false)}
          onConfirm={() => {
            setEStopEngaged((v) => !v);
            setEStopModal(false);
          }}
        />
      )}
    </div>
  );
}

/* ---- 브라우저 미리보기용 부트스트랩 (Vite 프로젝트에서는 불필요) ---- */
import { createRoot } from 'react-dom/client';
document.getElementById('boot')?.remove();
createRoot(document.getElementById('root')).render(<DigitalTwinDashboard />);
</script>
</body>
